version: '3.8'

services:
  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper-dev-pedido-receiver
    ports:
      - "2182:2182"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - pedido-net

  kafka:
    image: bitnami/kafka:3.4
    container_name: kafka-dev-pedido-receiver
    ports:
      - "9093:9093"
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
    networks:
      - pedido-net

  pedido-db:
    image: mysql:8.0
    container_name: pedido-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pedido_db
    ports:
      - "33064:3306"
    volumes:
      - pedido_dev_data:/var/lib/mysql
    networks:
      - pedido-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pedido-receiver-api:
    build: .
    container_name: pedido-receiver-api-dev
    depends_on:
      pedido-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://pedido-db:3306/pedido_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - pedido-net

volumes:
  pedido_dev_data:

networks:
  pedido-net: